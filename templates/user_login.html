{% extends 'base.html' %}

{% block content %}
<div class="admin-container">
    <div class="admin-section">
        <h1 class="admin-title">Login to Your Account</h1>
        <p class="admin-subtitle">Access your playlists and personalized features</p>
        
        <div class="admin-form-container">
            <form method="POST" action="{{ url_for('user_login') }}" class="admin-form">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>
            
            <div class="auth-links">
                <p>Don't have an account? <a href="{{ url_for('register') }}">Sign up here</a></p>
                <p>Continue without account? <a href="{{ url_for('showcase') }}">Browse tracks</a></p>
                <p><a href="{{ url_for('login') }}">Admin login</a></p>
            </div>
        </div>
    </div>
</div>

<style>
.admin-subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 2rem;
}

.auth-links {
    margin-top: 2rem;
    text-align: center;
}

.auth-links p {
    margin: 0.5rem 0;
    color: #888;
}

.auth-links a {
    color: #00ffff;
    text-decoration: none;
}

.auth-links a:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
